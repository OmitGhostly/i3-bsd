# Default apps used by the i3 scripts (shell syntax). Edit freely, or change them in the settings window
# (SUPER+ALT+M > Keybindings > Change application). browser="" means your system default browser.
# files: yazi (the default) and other terminal file managers open in the terminal from term=.
term="ghostty"
files="yazi"
browser=""
editor="${EDITOR:-nano}"
search_engine="https://www.google.com/search?q={}"
